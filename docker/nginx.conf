server {
    listen 3000;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # No Content-Security-Policy here deliberately: the app relies on inline
    # styles (React's `style={{...}}` prop) throughout and loads Google Fonts —
    # getting a CSP right needs browser verification that hasn't been done
    # yet. See SECURITY.md. (The API is same-origin via the /api/ proxy below
    # unless VITE_API_URL was overridden at build time, so connect-src no
    # longer varies by deployment the way it used to.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # nginx's default (1m) is too small for a real log-ingestion batch --
        # the agent caps batches at 500 events (MAX_INGEST_BATCH_SIZE in
        # agent/tp_agent.py), and Sysmon events carrying full command-line/
        # message text routinely push a 500-event batch past 1MB, so every
        # such batch was rejected with a 413 before ever reaching the
        # backend. Caddyfile (prod) sets the same 20MB cap.
        client_max_body_size 20m;
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwritten, not appended: a client-supplied X-Forwarded-For must
        # never reach the backend, or anyone could pick their own rate-limit
        # identity if the backend were ever told to trust this proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
