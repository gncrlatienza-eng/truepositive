server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No Content-Security-Policy here deliberately: the app relies on inline
    # styles (React's `style={{...}}` prop) throughout and loads Google Fonts —
    # getting a CSP right needs browser verification that hasn't been done
    # yet. See SECURITY.md. (The API is same-origin via the /api/ proxy below
    # unless VITE_API_URL was overridden at build time, so connect-src no
    # longer varies by deployment the way it used to.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
