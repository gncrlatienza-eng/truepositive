server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No Content-Security-Policy here deliberately: the app relies on inline
    # styles (React's `style={{...}}` prop) throughout and loads Google Fonts,
    # and the API origin (connect-src) varies by deployment (VITE_API_URL) —
    # getting a CSP right needs env-aware templating and browser verification
    # neither of which is done yet. See SECURITY.md.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
