services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: truepositive
      POSTGRES_PASSWORD: truepositive
      POSTGRES_DB: truepositive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truepositive"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://truepositive:truepositive@postgres:5432/truepositive
    volumes:
      # Read-only: lets GET /agents/download/windows serve the built binary
      # without baking it into the image (agent/dist/ is a gitignored,
      # locally-built PyInstaller artifact — see agent/README.md).
      - ./agent/dist:/app/agent_dist:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
