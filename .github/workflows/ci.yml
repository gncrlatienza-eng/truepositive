name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # test_agents.py/test_log_sources.py/test_whitelist.py exercise real
      # JSONB, native-enum, and UUID columns — SQLite can't stand in.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: truepositive
          POSTGRES_PASSWORD: truepositive
          POSTGRES_DB: truepositive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truepositive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: ci-placeholder-secret-not-for-real-use
      CREDENTIAL_ENCRYPTION_KEY: KMpxRR-i1Th9aZAoc-KvHHjMwj6GIII5mK-coU656-8=
      DATABASE_URL: postgresql://truepositive:truepositive@localhost:5432/truepositive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest

  frontend:
    name: Frontend (eslint, prettier, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
