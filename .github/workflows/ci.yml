name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token -- these jobs only need to read the repo.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # test_agents.py/test_log_sources.py/test_whitelist.py exercise real
      # JSONB, native-enum, and UUID columns — SQLite can't stand in.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: truepositive
          POSTGRES_PASSWORD: truepositive
          POSTGRES_DB: truepositive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truepositive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: ci-placeholder-secret-not-for-real-use
      CREDENTIAL_ENCRYPTION_KEY: KMpxRR-i1Th9aZAoc-KvHHjMwj6GIII5mK-coU656-8=
      DATABASE_URL: postgresql://truepositive:truepositive@localhost:5432/truepositive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      # Production (Render) builds its schema from migrations on an empty
      # database; run them here too so a broken migration fails CI first.
      - run: alembic upgrade head
      - run: pytest

  agent:
    name: Agent (ruff, pytest)
    # The agent is Windows-only and several tests touch Windows-only stdlib
    # attributes (e.g. subprocess.CREATE_NO_WINDOW), so test on Windows.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Stdlib-only agent -- no requirements file needed.
      - run: pip install pytest ruff
      - run: ruff check --line-length 120 tp_agent.py test_tp_agent.py
      - run: pytest -q test_tp_agent.py

  frontend:
    name: Frontend (eslint, prettier, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
